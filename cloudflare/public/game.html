function getStudyCards(player,side){const cards=[],usedNames=new Set(),learned=player.kartuIlmu[side]||{};const available=[];ilmuNames[side].forEach(name=>{const currentRarity=learned[name];for(let rarity=0;rarity<4;rarity++){if(currentRarity===undefined||rarity>currentRarity)available.push({name,rarity});}});if(!available.length)return [];if(player.masterGuarantee){const masterChoices=available.filter(x=>x.rarity===3);while(cards.length<3&&masterChoices.length){const i=Math.floor(Math.random()*masterChoices.length);cards.push(masterChoices.splice(i,1)[0]);}return cards;}let guard=0;while(cards.length<3&&guard++<1000){const rarity=rollRarity(),candidates=available.filter(x=>x.rarity===rarity&&!usedNames.has(x.name));if(!candidates.length)continue;const chosen=candidates[Math.floor(Math.random()*candidates.length)];usedNames.add(chosen.name);cards.push(chosen);}if(cards.length<3){const remaining=available.filter(x=>!usedNames.has(x.name));while(cards.length<3&&remaining.length){const chosen=remaining.splice(Math.floor(Math.random()*remaining.length),1)[0];usedNames.add(chosen.name);cards.push(chosen);}}return cards;}

function ownRegions(player){
  const side=player.tribe.toLowerCase(),out=[];
  for(let n=1;n<=40;n++){
    if(gateNumbers.includes(n)||palaceNumbers.includes(n))continue;

function pay(player,amount){
  const cost=Math.max(0,Number(amount)||0);
  if(player.logam<cost)return false;
  player.logam-=cost;
  return true;
}
function stealOnLanding(player){
  const victim=players.find(p=>p!==player&&p.pos===player.pos);
  if(!victim||victim.logam<=0)return 0;
  if(victim.confiningRegion!==null){
    log('🛡️ '+victim.name+' sedang mengurung '+regionName(victim.confiningRegion)+' dan terlindung dari pencurian Logam.');
    return 0;
  }
  const stolen=Math.min(30,Math.floor(victim.logam*0.25));
  if(stolen<=0)return 0;
  victim.logam-=stolen;
  player.logam+=stolen;
  log('🪙 '+player.name+' mendarat di wilayah '+victim.name+' dan mencuri '+stolen+' Logam (25%, maksimal 30).');
  return stolen;
}

function hasOtodidak(player,side){return player.ilmu[side]>=5;}
function applyOtodidakAbility(player){
 if(player.cursed){log(player.name+' sedang Terkutuk; efek Ilmu dan kartu tidak aktif.');return {homeland:false,wind:false};}
 const n=player.pos;
 const homeland=regions[n].side===player.tribe.toLowerCase();
 if(!homeland)return {homeland:false,wind:false};
 if(hasOtodidak(player,'api')){
  const gained=addND(player,2);
  log(player.name+' memiliki Otodidak Api dan berada di wilayah kelahirannya. ND +'+gained+' ('+player.nd+'/100).');
 }
 if(hasOtodidak(player,'air')){
  if(!gateNumbers.includes(n)&&!palaceNumbers.includes(n)&&Number(regions[n].hp)>0){
   const before=regions[n].hp;
   regions[n].hp=Math.min(1000,before+25);
   log(player.name+' memiliki Otodidak Air dan berada di wilayah kelahirannya. HP '+regionName(n)+' +'+(regions[n].hp-before)+' (maks. 1.000).');flashHP(n,regions[n].hp-before);
  }else if(!gateNumbers.includes(n)&&!palaceNumbers.includes(n)&&Number(regions[n].hp)<=0){
   log(regionName(n)+' sudah mati (HP 0), sehingga Mudik Air tidak dapat memulihkan wilayah ini.');
  }
 }
 if(hasOtodidak(player,'angin') && !player.windPrimed){
  player.windNextTurn=true;
  player.windPrimed=true;
  log(player.name+' memiliki Otodidak Angin. Efek dipersiapkan untuk giliran berikutnya: 2 kali kesempatan melempar dadu.');
 }
 if(hasOtodidak(player,'tanah')){
  log(player.name+' memiliki Otodidak Tanah dan berada di wilayah kelahirannya. Serangan terhadap wilayah kelahiran ini dikurangi 50% selama pemain ini berada di wilayah kelahirannya.');
 }
 return {homeland:true};
}

function clearPassedPoison(player,start,steps){for(let i=1;i<=steps;i++){const n=((start-1+i)%40)+1;if(regions[n].nuclear&&regions[n].nuclear.owner===player.name){regions[n].nuclear=null;log('☢️ '+player.name+' melewati/berhenti di '+regionName(n)+', sehingga Nuklir gagal meledak.');}if(regions[n].poison>0&&regions[n].side===player.tribe.toLowerCase()){const old=regions[n].poison;regions[n].poison=0;log(player.name+' tiba/melewati '+regionName(n)+', sehingga racun ☠️ '+old+' hilang.');}}}
// Racun hanya boleh diberikan ke SATU wilayah selama satu giliran pemain.

function applyPoison(player,n,source,diceTotal){const region=regions[n],side=player.tribe.toLowerCase();if(player.effectUsed.poison)return false;const defender=players.find(p=>p.tribe.toLowerCase()===region.side);if(defender&&defender.antiPoisonTurns>0)return false;if(gateNumbers.includes(n)||palaceNumbers.includes(n)||region.side===side||Number(region.hp)<=0)return false;const level=getCardBonus(player,'air',source==='biasa'?'Serangan Air':'Grilya Air');if(level<=0)return false;const poisonValue=Math.round(level);if(poisonValue<=0)return false;const old=region.poison||0;if(poisonValue>old){region.poison=poisonValue;log('☠️ '+player.name+' meracuni '+regionName(n)+' dengan racun '+poisonValue+' HP per akhir giliran'+(old?(' (menggantikan racun '+old+')'):'')+'.');}else if(old>0){log('☠️ '+regionName(n)+' sudah memiliki racun '+old+'; racun '+poisonValue+' tidak menumpuk dan tidak menggantikan racun yang lebih tinggi.');}player.effectUsed.poison=true;return true;}
function applyPoisonToLastTarget(player,targets,source,diceTotal){if(player.effectUsed.poison)return false;for(let i=targets.length-1;i>=0;i--){const n=targets[i];if(applyPoison(player,n,source,diceTotal))return true;}return false;}
function tickPoison(){Object.keys(regions).forEach(k=>{const n=Number(k),r=regions[n];if(Number(r.hp)<=0){r.poison=0;r.nuclear=null;r.attackedBy=null;r.damageTaken=0;return;}if(!r.poison||gateNumbers.includes(n)||palaceNumbers.includes(n)||r.hp===null)return;const before=Number(r.hp)||0;if(before<=0){r.poison=0;return;}const amount=Math.min(r.poison,before);r.hp=Math.max(0,before-amount);r.damageTaken=(r.damageTaken||0)+amount;const defender=players.find(p=>p.tribe.toLowerCase()===r.side);if(defender)defender.damageBirthReceived+=amount;log('☠️ Racun '+regionName(n)+' mengurangi HP sebesar '+amount+'. HP tersisa: '+r.hp.toLocaleString('id-ID')+'.');if(r.hp>0){setTimeout(()=>flashPoison(n,amount),20);}else{r.poison=0;r.attackedBy=null;}});render();}
function flashPoison(n,amount){const cell=document.querySelector('.cell[data-region="'+n+'"]');if(!cell)return;const f=document.createElement('div');f.className='poison-float';f.textContent='☠️ -'+amount;cell.appendChild(f);setTimeout(()=>f.remove(),1300);}
function flashHP(n,amount){if(amount<=0)return;const cell=document.querySelector('.cell[data-region="'+n+'"]');if(!cell)return;const f=document.createElement('div');f.className='hp-float';f.textContent='+'+amount+' HP';cell.appendChild(f);setTimeout(()=>f.remove(),1300);}
function addEffectDamage(player,n,amount,label){
 const r=regions[n];
 if(!r||gateNumbers.includes(n)||palaceNumbers.includes(n)||Number(r.hp)<=0)return false;
 const before=Number(r.hp)||0,damageNow=Math.min(amount,before);
 if(damageNow<=0)return false;
 r.hp=Math.max(0,before-damageNow);
 r.damageTaken=(r.damageTaken||0)+damageNow;
 player.damageDealt+=damageNow;
 const defender=players.find(p=>p.tribe.toLowerCase()===r.side);
 if(defender)defender.damageBirthReceived+=damageNow;
 log(player.name+' '+label+' '+regionName(n)+' sebesar '+damageNow+' damage. HP tersisa: '+r.hp.toLocaleString('id-ID')+'.');
 if(r.hp<=0){
  releaseConfinement(r);r.poison=0;r.nuclear=null;r.attackedBy=null;
  player.logam+=KILL_METAL;
  log('💰 '+player.name+' mendapat +'+KILL_METAL+' Logam karena efek '+label+' mematikan '+regionName(n)+'.');
 }
 return true;
}
function burnAdjacentRegions(player,n,source){
 if(player.cursed||player.effectUsed.fireBurn)return false;
 const cardName=source.startsWith('Gerilya')?'Grilya Api':'Serangan Api';
 if(!isCardActive(player,source.startsWith('Gerilya')?'gerilya':'serangan',cardName))return false;
 const rarity=player.kartuIlmu.api?.[cardName];
 if(rarity===undefined)return false;
 player.effectUsed.fireBurn=true;
 const chance=fireBurnChance[rarity]||0;
 if(Math.random()>=chance){log('🔥 Efek bakar '+cardName+' gagal pada '+regionName(n)+' ('+Math.round(chance*100)+'% chance).');return false;}
 const left=n===1?40:n-1,right=n===40?1:n+1;
 const targets=[left,right].filter(x=>!gateNumbers.includes(x)&&!palaceNumbers.includes(x)&&Number(regions[x].hp)>0);
 log('🔥 Efek bakar '+cardName+' berhasil! '+regionName(n)+' membakar wilayah di kedua sisi ('+Math.round(chance*100)+'% chance).');
 targets.forEach((x,i)=>{if(addEffectDamage(player,x,FIRE_BURN_DAMAGE,'membakar')){const cell=document.querySelector('.cell[data-region="'+x+'"]');if(cell){const f=document.createElement('div');f.className='fire-float '+(i===0?'left':'right');f.textContent='🔥 -'+FIRE_BURN_DAMAGE;cell.appendChild(f);setTimeout(()=>f.remove(),1200);}}});
 render();
 return true;
}
function applyWindCritical(player,n,source,diceTotal){
 if(player.cursed||player.effectUsed.windCritical||diceTotal<=WIND_CRIT_THRESHOLD)return false;
 const kind=source.startsWith('Gerilya')?'gerilya':'serangan';
 const cardName=kind==='gerilya'?'Grilya Angin':'Serangan Angin';
 if(!isCardActive(player,kind,cardName))return false;
 if(!regions[n]||Number(regions[n].hp)<=0)return false;
 player.effectUsed.windCritical=true;
 log('💥 Efek Kritis '+cardName+' aktif! Total dadu '+diceTotal+' > '+WIND_CRIT_THRESHOLD+'. +'+WIND_CRIT_DAMAGE+' damage ke '+regionName(n)+'.');
 const ok=addEffectDamage(player,n,WIND_CRIT_DAMAGE,'mendapat Kritis');
 if(ok){const cell=document.querySelector('.cell[data-region="'+n+'"]');if(cell){const f=document.createElement('div');f.className='fire-float';f.textContent='💥 +'+WIND_CRIT_DAMAGE;cell.appendChild(f);setTimeout(()=>f.remove(),1200);}}
 render();
 return ok;
}
function attackRegion(player,n,mult=1,source='biasa',diceTotal=0){if(gateNumbers.includes(n)||palaceNumbers.includes(n))return false;const region=regions[n],side=player.tribe.toLowerCase();if(Number(region.hp)<=0)return false;if(region.side===side)return false;const protector=players.find(p=>!p.cursed&&hasOtodidak(p,'tanah')&&regions[p.pos].side===p.tribe.toLowerCase()&&region.side===p.tribe.toLowerCase());const shieldOwner=players.find(p=>!p.cursed&&p.shieldTurns>0&&region.side===p.tribe.toLowerCase());const baseAmount=damage[side]*mult;let bonus=0;const bonusDetails=[];const sourceIsGerilya=source.startsWith('Gerilya');const attackCard=sourceIsGerilya?'Grilya '+(source.includes('Air')?'Air':source.includes('Angin')?'Angin':source.includes('Api')?'Api':source.includes('Tanah')?'Tanah':''):'Serangan '+(source==='biasa'?'':source);
if(source==='biasa'){
 const apiBonus=isCardActive(player,'serangan','Serangan Api')?baseAmount*getCardBonus(player,'api','Serangan Api'):0;if(apiBonus>0){bonus+=apiBonus;bonusDetails.push(['Serangan Api',Math.round(apiBonus)]);}
 const anginBonus=isCardActive(player,'serangan','Serangan Angin')?getCardBonus(player,'angin','Serangan Angin')*diceTotal:0;if(anginBonus>0){bonus+=anginBonus;bonusDetails.push(['Serangan Angin',Math.round(anginBonus)]);}
}
if(sourceIsGerilya){
 const apiBonus=isCardActive(player,'gerilya','Grilya Api')?damage[side]*getCardBonus(player,'api','Grilya Api'):0;if(apiBonus>0){bonus+=apiBonus;bonusDetails.push(['Grilya Api',Math.round(apiBonus)]);}
 const anginBonus=isCardActive(player,'gerilya','Grilya Angin')?getCardBonus(player,'angin','Grilya Angin')*diceTotal:0;if(anginBonus>0){bonus+=anginBonus;bonusDetails.push(['Grilya Angin',Math.round(anginBonus)]);}
}
let amount=Math.round(baseAmount+bonus);

if(protector){const reduced=Math.round(amount*0.5);log(regionName(n)+' dilindungi Mudik Tanah milik '+protector.name+': damage berkurang 50% ('+amount+' → '+reduced+').');amount=reduced;}if(shieldOwner){const reduced=Math.round(amount*0.5);log(regionName(n)+' dilindungi Tameng milik '+shieldOwner.name+': damage berkurang 50% ('+amount+' → '+reduced+').');}
if(shieldOwner)amount=Math.round(amount*0.5);
region.hp=Math.max(0,Number(region.hp)-amount);region.damageTaken=(region.damageTaken||0)+amount;region.attackedBy=player.color;player.damageDealt+=amount;const birthDefender=players.find(p=>p.tribe.toLowerCase()===region.side);if(birthDefender)birthDefender.damageBirthReceived+=amount;log(player.name+' menyerang '+regionName(n)+' sebesar '+amount+' damage'+(source!=='biasa'?' ('+source+')':'')+'. HP tersisa: '+region.hp.toLocaleString('id-ID')+'.');bonusDetails.forEach(([card,val])=>log('✨ Bonus '+card+' menambahkan +'+val+' damage.'));if(region.hp>0&&((source==='biasa'&&isCardActive(player,'serangan','Serangan Air'))||(sourceIsGerilya&&source.includes('Air')&&isCardActive(player,'gerilya','Grilya Air')))){player._poisonTargets=player._poisonTargets||[];player._poisonTargets.push(n);}if(region.hp>0&&((source==='biasa'&&isCardActive(player,'serangan','Serangan Api'))||(sourceIsGerilya&&isCardActive(player,'gerilya','Grilya Api'))))burnAdjacentRegions(player,n,source);if(region.hp>0&&((source==='biasa'&&isCardActive(player,'serangan','Serangan Angin'))||(sourceIsGerilya&&isCardActive(player,'gerilya','Grilya Angin'))))applyWindCritical(player,n,source,diceTotal);
if(region.hp<=0){releaseConfinement(region);region.poison=0;region.nuclear=null;player.logam+=KILL_METAL;log('💰 '+player.name+' mendapat +'+KILL_METAL+' Logam karena mematikan '+regionName(n)+'.');}if(!player.attackRewarded){player.logam+=ATTACK_METAL;player.attackRewarded=true;log('💰 '+player.name+' mendapat +'+ATTACK_METAL+' Logam karena berhasil menyerang wilayah musuh.');}return true;}
function openEdit(n){if(gateNumbers.includes(n)||palaceNumbers.includes(n))return;editN=n;document.getElementById('mTitle').textContent=regionName(n);document.getElementById('mSub').textContent='HP saat ini: '+regions[n].hp.toLocaleString('id-ID')+' (maks. 1.000)';document.getElementById('hpInput').value=regions[n].hp;document.getElementById('modal').classList.add('show');document.getElementById('hpInput').focus();}
function isLearningSpot(n){return gateNumbers.includes(n)||palaceNumbers.includes(n);}
function cardEffectText(side,name,rarity){const e=cardEffects[side]?.[name];if(!e)return 'Tidak ada efek khusus. Kartu ini tetap menambah +1 poin Ilmu.';const value=e[rarityKeys[rarity]]||0;if(name==='Serangan Api')return 'Serangan biasa mendapat bonus '+Math.round(value*100)+'% dan memiliki '+Math.round(fireBurnChance[rarity]*100)+'% chance membakar kedua wilayah normal di samping target, masing-masing -10 HP. Efek bakar maksimal 1 kali per giliran.';if(name==='Grilya Api')return 'Gerilya mendapat bonus '+Math.round(value*100)+'% dan memiliki '+Math.round(fireBurnChance[rarity]*100)+'% chance membakar kedua wilayah normal di samping target, masing-masing -10 HP. Efek bakar maksimal 1 kali per giliran.';if(name==='Serangan Angin')return 'Serangan biasa mendapat bonus +'+value+' × total hasil dadu. Jika total dadu >9, Kritis +20 damage ke 1 wilayah. Efek Kritis maksimal 1 kali per giliran.';if(name==='Grilya Angin')return 'Gerilya mendapat bonus +'+value+' × total hasil dadu. Jika total dadu >9, Kritis +20 damage ke 1 wilayah. Efek Kritis maksimal 1 kali per giliran.';if(name==='Serangan Air')return 'Serangan biasa meracuni wilayah tujuan: '+Math.round(value)+' HP berkurang setiap akhir giliran.';if(name==='Grilya Air')return 'Serangan Grilya meracuni wilayah tujuan akhir: '+Math.round(value)+' HP berkurang setiap akhir giliran.';if(name==='Serangan Tanah')return 'Mengurung wilayah tempat kamu berhenti. Memberi '+Math.round(value)+' Logam langsung dan setiap akhir giliran pemain lain sampai giliranmu berikutnya. Wilayah tidak memberi pendapatan kepada pemiliknya.';if(name==='Gerilya Tanah')return 'Mengurung satu wilayah: hanya wilayah normal tempat kamu berhenti. Memberi '+Math.round(value)+' Logam langsung dan setiap akhir giliran pemain lain sampai giliranmu berikutnya.';return 'Tidak ada efek khusus.';}
let pendingLearn=null;
function showLearningChoices(player,side,cards){const modal=document.getElementById('cardModal'),options=document.getElementById('cardOptions');pendingLearn={player,side,cards};document.getElementById('cardTitle').textContent='Mempelajari Ilmu '+side[0].toUpperCase()+side.slice(1);document.getElementById('cardSub').textContent=player.name+' berada di '+regionName(player.pos)+'. Pilih satu dari tiga kartu. '+(player.masterGuarantee?'⭐ Jaminan Master aktif: semua pilihan adalah Master.':'Peluang tingkat: Biasa 60% • Bagus 25% • Super 10% • Master 5%.');options.innerHTML=cards.map((c,i)=>'<div class="learn-card card-'+side+' rarity-'+rarityKeys[c.rarity]+'" data-index="'+i+'"><span class="rarity">'+rarityNames[c.rarity]+'</span><span class="skill">'+c.name+'</span><span class="effect">'+cardEffectText(side,c.name,c.rarity)+'</span><span class="choose">'+(player.kartuIlmu[side][c.name]!==undefined?'Upgrade kartu ini':'Pilih kartu ini')+'</span></div>').join('');options.querySelectorAll('.learn-card').forEach(card=>{card.onclick=()=>selectLearningCard(Number(card.dataset.index));});modal.classList.add('show');}
function openLearningCards(player,side){if(player.cursed){log(player.name+' sedang Terkutuk dan tidak dapat mempelajari Ilmu.');document.getElementById('end').disabled=false;return;}if(player.ilmu[side]>=25){log(player.name+' sudah mencapai maksimal 25 poin Ilmu '+side+'.');document.getElementById('end').disabled=false;return;}const cards=getStudyCards(player,side);if(!cards.length){log(player.name+' sudah memiliki semua kartu Ilmu '+side+' pada tingkat yang tersedia.');document.getElementById('end').disabled=false;return;}showLearningChoices(player,side,cards);}
function switchNeeded(player,name){const kind=cardKind(name);if(!kind)return false;const active=activeCardName(player,kind);return !!active&&active!==name;}
function requestSwitch(player,name){const kind=cardKind(name),active=activeCardName(player,kind);pendingSwitch={player,name,kind};document.getElementById('switchTitle').textContent='Ganti Jenis '+(kind==='serangan'?'Serangan':'Gerilya')+'?';document.getElementById('switchText').textContent='Saat ini '+active+' sedang aktif. Apakah kamu yakin ingin menggantinya dengan '+name+'? Jika dibatalkan, pilihan 3 kartu tadi tetap sama dan tidak diacak ulang.';document.getElementById('switchModal').classList.add('show');}
let pendingSwitch=null;
function activateCard(player,name){const kind=cardKind(name);if(!kind)return false;if(kind==='serangan')player.activeSerangan=name;else if(kind==='gerilya')player.activeGerilya=name;log('⚔️ '+name+' sekarang menjadi '+(kind==='serangan'?'Serangan':'Gerilya')+' aktif bagi '+player.name+'.');return true;}
function finishLearning(player,side,chosen){const oldRarity=player.kartuIlmu[side][chosen.name];player.kartuIlmu[side][chosen.name]=chosen.rarity;player.ilmu[side]=Math.min(25,player.ilmu[side]+1);if(player.masterGuarantee)player.masterGuarantee=false;const hasEffect=!!(cardEffects[side]&&cardEffects[side][chosen.name]);if(hasEffect){const action=oldRarity===undefined?'mempelajari':'meng-upgrade';log(player.name+' '+action+' Ilmu '+chosen.name+' ('+rarityNames[chosen.rarity]+'). +1 poin Ilmu.');if(cardKind(chosen.name))activateCard(player,chosen.name);}document.getElementById('cardModal').classList.remove('show');pendingLearn=null;render();document.getElementById('end').disabled=false;if(autopilot)setTimeout(runAutopilot,100);}
function selectLearningCard(index){if(!pendingLearn)return;const {player,side,cards}=pendingLearn;const chosen=cards[index];if(switchNeeded(player,chosen.name)){requestSwitch(player,chosen.name);return;}finishLearning(player,side,chosen);}
document.getElementById('switchYes').onclick=()=>{if(!pendingSwitch)return;const q=pendingSwitch;if(q.kind==='serangan')q.player.activeSerangan=q.name;else q.player.activeGerilya=q.name;log('🔄 '+q.player.name+' mengonfirmasi pergantian '+(q.kind==='serangan'?'Serangan':'Gerilya')+' aktif: '+q.name+'.');document.getElementById('switchModal').classList.remove('show');if(pendingLearn)finishLearning(pendingLearn.player,pendingLearn.side,pendingLearn.cards.find(c=>c.name===q.name));pendingSwitch=null;};
document.getElementById('switchNo').onclick=()=>{document.getElementById('switchModal').classList.remove('show');pendingSwitch=null;log('↩️ Pergantian dibatalkan. Tiga pilihan kartu tetap sama dan tidak diacak ulang.');if(pendingLearn)showLearningChoices(pendingLearn.player,pendingLearn.side,pendingLearn.cards);};

function releaseConfinement(region){
  if(!region||!region.terkurungBy)return;
  const owner=players.find(p=>p.name===region.terkurungBy);
  if(owner&&owner.confiningRegion===Number(Object.keys(regions).find(k=>regions[k]===region))){
    owner.confiningRegion=null;owner.confinementRarity=null;owner.confinementReward=0;owner.confinementPayouts=0;owner.confinementStartedTurn=-1;
  }
  region.terkurung=false;region.terkurungBy=null;region.terkurungSource=null;region.terkurungRarity=null;region.terkurungReward=0;region.terkurungPayouts=0;
}
function releasePlayerConfinement(player,reason){
  if(player.confiningRegion===null)return;
  const n=player.confiningRegion,r=regions[n];
  if(r&&r.terkurungBy===player.name){
    releaseConfinement(r);
    log('🔓 Kurungan '+regionName(n)+' berakhir'+(reason?': '+reason:'.'));
  }else{
    player.confiningRegion=null;player.confinementRarity=null;player.confinementReward=0;player.confinementPayouts=0;player.confinementStartedTurn=-1;
  }
}
function applyTerkurung(player,n,source){
  const r=regions[n];
  if(gateNumbers.includes(n)||palaceNumbers.includes(n)||Number(r.hp)<=0||r.side===player.tribe.toLowerCase())return false;
  const side='tanah',cardName=source;
  const rarity=player.kartuIlmu[side]?.[cardName];
  if(rarity===undefined||!isCardActive(player,cardKind(cardName),cardName))return false;
  if(player.confiningRegion!==null&&player.confiningRegion!==n)releasePlayerConfinement(player,'pemain membuat kurungan baru');
  const reward=[2,3,4,5][rarity]||2;
  r.terkurung=true;r.terkurungBy=player.name;r.terkurungSource=source;r.terkurungRarity=rarity;r.terkurungReward=reward;r.terkurungPayouts=0;
  player.confiningRegion=n;player.confinementRarity=rarity;player.confinementReward=reward;player.confinementPayouts=0;player.confinementStartedTurn=totalTurnsCompleted;
  player.logam+=reward;
  log('🔒 '+player.name+' menggunakan '+source+' dan mengurung '+regionName(n)+'. +'+reward+' Logam langsung. Pemilik wilayah tidak mendapat pendapatan dari wilayah ini.');
  return true;
}
function applyTanahCard(player,n,kind){const name=kind==='serangan'?'Serangan Tanah':'Gerilya Tanah';return isCardActive(player,kind,name)?applyTerkurung(player,n,name):false;}
function payConfinementRewards(endingPlayer){
  players.forEach(p=>{
    if(p===endingPlayer||p.confiningRegion===null||p.confinementPayouts>=3)return;
    const r=regions[p.confiningRegion];
    if(!r||!r.terkurung||r.terkurungBy!==p.name)return;
    p.logam+=p.confinementReward;p.confinementPayouts++;r.terkurungPayouts=p.confinementPayouts;
    log('🔒 '+p.name+' mendapat +'+p.confinementReward+' Logam karena '+endingPlayer.name+' mengakhiri giliran ('+p.confinementPayouts+'/3).');
  });
}
function checkConfinementAfterMove(player,oldPos){
  if(player.confiningRegion===null)return;
  if(player.confinementStartedTurn===totalTurnsCompleted)return;
  if(player.pos!==player.confiningRegion){releasePlayerConfinement(player,'pemain pengurung meninggalkan wilayah pada giliran berikutnya');}
}
function openShop(){const p=players[current];if(rolled||p.shopUsedThisTurn||!isHomeland(p)||p.logam<SHOP_COST)return;p.shopUsedThisTurn=true;pay(p,SHOP_COST);shopShuffleCost=50;shopPicks=Object.keys(shopItems).filter(k=>k!=='acak').sort(()=>Math.random()-.5).slice(0,5);renderShopOptions(p);document.getElementById('shopModal').classList.add('show');render();}
function renderShopOptions(p){const opts=document.getElementById('shopOptions'),info=document.getElementById('shopInfo');document.getElementById('shopSub').textContent=p.name+' membayar '+SHOP_COST+' Logam. Klik item untuk melihat efek, klik lagi untuk membeli. 🔄 Acak langsung mengacak ulang 5 item dengan biaya yang berlipat 2.';info.innerHTML='Klik item untuk melihat efek.';const all=[...shopPicks,'acak'];opts.innerHTML=all.map(k=>{const it=shopItems[k],isAcak=k==='acak',dis=k==='medicine'&&!p.cursed,price=isAcak?shopShuffleCost:it.price;return '<div class="shop-card '+(dis?'disabled':'')+'" data-k="'+k+'"><b><span class="shop-icon">'+shopIcons[k]+'</span><span class="shop-price">'+price+' 🪙</span></b></div>';}).join('');opts.querySelectorAll('.shop-card').forEach(x=>x.onclick=()=>{if(x.classList.contains('disabled'))return;const k=x.dataset.k;if(k==='acak'){rerollShop(p);return;}if(x.classList.contains('shop-selected'))buyShop(k);else{opts.querySelectorAll('.shop-card').forEach(y=>y.classList.remove('shop-selected'));x.classList.add('shop-selected');const it=shopItems[k];info.innerHTML='<b>'+shopIcons[k]+' '+it.name+' — '+it.price+' 🪙</b>'+it.desc;}});}
function rerollShop(p){if(!document.getElementById('shopModal').classList.contains('show'))return;if(p.logam<shopShuffleCost){log('🔄 Logam tidak cukup untuk Acak: butuh '+shopShuffleCost+', tersedia '+p.logam+'.');return;}pay(p,shopShuffleCost);log(p.name+' menggunakan Acak seharga '+shopShuffleCost+' Logam.');shopShuffleCost*=2;shopPicks=Object.keys(shopItems).filter(k=>k!=='acak').sort(()=>Math.random()-.5).slice(0,5);renderShopOptions(p);render();}

function tickNuclear(startPlayer){Object.keys(regions).forEach(k=>{const n=Number(k),r=regions[n];if(!r.nuclear||r.nuclear.owner!==startPlayer.name)return;r.nuclear.turns--;if(r.nuclear.turns<=0){const dmg=Math.min(200,Number(r.hp)||0);r.hp=Math.max(0,Number(r.hp)-200);r.damageTaken=(r.damageTaken||0)+dmg;log('☢️ Nuklir di '+regionName(n)+' MELEDAK: -'+dmg+' HP.');r.nuclear=null;}});}

function nextTurn(){payConfinementRewards(players[current]);totalTurnsCompleted++;tickPoison();Object.values(regions).forEach(r=>{r.attackedBy=null;r.damageTaken=0;});players.forEach(p=>{p.attackRewarded=false;p.shopUsedThisTurn=false;p.effectUsed={fireBurn:false,windCritical:false,poison:false};});awardEconomyIfNeeded();current=(current+1)%players.length;while(players[current].trapped>0){players[current].trapped--;log(players[current].name+' terkurung dan melewati giliran ini.');current=(current+1)%players.length;}if(players[current].shieldTurns>0)players[current].shieldTurns--;if(players[current].antiPoisonTurns>0)players[current].antiPoisonTurns--;tickNuclear(players[current]);rolled=false;rollsThisTurn=0;rollLimit=players[current].windNextTurn?2:1;players[current].windNextTurn=false;players[current].windPrimed=false;document.getElementById('roll').disabled=false;document.getElementById('guerrilla').disabled=players[current].nd<20;document.getElementById('end').disabled=true;document.getElementById('d1').textContent='–';document.getElementById('d2').textContent='–';render();}

const side=p.tribe.toLowerCase();
if(side==='angin'){
  let hits=0,attacked=[];p._poisonTargets=[];
  for(let attempt=1;attempt<=2;attempt++){const a=1+Math.floor(Math.random()*6),c=1+Math.floor(Math.random()*6),steps=a+c,old=p.pos;p.pos=((p.pos-1+steps)%40)+1;checkConfinementAfterMove(p,old);clearPassedPoison(p,old,steps);document.getElementById('d1').textContent=a;document.getElementById('d2').textContent=c;log(p.name+' Gerilya Angin percobaan '+attempt+'/2: '+a+' + '+c+' → '+old+' → '+p.pos+'.');if(attackRegion(p,p.pos,1,'Gerilya Angin',steps)){hits++;attacked.push(regionName(p.pos));}}
  applyPoisonToLastTarget(p,p._poisonTargets,'Gerilya Angin',0);p._poisonTargets=[];
  log(p.name+' menyelesaikan Serangan Gerilya Angin setelah tepat 2 percobaan, mengenai '+hits+' wilayah.');
  if(attacked.length)log('Wilayah yang diserang: '+attacked.join(', ')+'.');applyTanahCard(p,p.pos,'gerilya');
}else if(side==='air'){
  const a=1+Math.floor(Math.random()*6),c=1+Math.floor(Math.random()*6),steps=a+c,old=p.pos;document.getElementById('d1').textContent=a;document.getElementById('d2').textContent=c;log(p.name+' Gerilya Air: '+a+' + '+c+' = '+steps+' langkah dari '+old+'.');
  clearPassedPoison(p,old,steps);

  applyPoisonToLastTarget(p,p._poisonTargets,'Gerilya Air 50%',steps);p._poisonTargets=[];
  p.pos=((old-1+steps)%40)+1;checkConfinementAfterMove(p,old);
  if(isCardActive(p,'gerilya','Grilya Air'))applyPoison(p,p.pos,'Grilya Air 50%',steps);applyTanahCard(p,p.pos,'gerilya');
}else{
  const a=1+Math.floor(Math.random()*6),c=1+Math.floor(Math.random()*6),steps=a+c,old=p.pos;document.getElementById('d1').textContent=a;document.getElementById('d2').textContent=c;log(p.name+' Serangan Gerilya: '+a+' + '+c+' = '+steps+' langkah dari '+old+'.');clearPassedPoison(p,old,steps);p.pos=((old-1+steps)%40)+1;checkConfinementAfterMove(p,old);
  const mult=side==='api'?2:1;const gsource=side==='api'?'Gerilya Api 2x':'Gerilya';attackRegion(p,p.pos,mult,gsource,steps);applyTanahCard(p,p.pos,'gerilya');
  
}
render();document.getElementById('end').disabled=false;};

/* ===== EMPAT-TITIK ONLINE SYNC ===== */
let onlineSocket=null, onlineReady=false, applyingRemoteState=false, syncTimer=null;
const onlineStatusEl=()=>document.getElementById('onlineStatus');
function setOnlineStatus(kind,text){const el=onlineStatusEl();if(!el)return;el.className='online-status '+kind;el.textContent=text;}
function getSharedState(){
  return {players,regions,current,rolled,rollsThisTurn,rollLimit,economyTurnCount,totalTurnsCompleted};
}
function applySharedState(s){
  if(!s||!Array.isArray(s.players)||!s.regions)return;
  applyingRemoteState=true;
  try{
    s.players.forEach((sp,i)=>{if(players[i])Object.assign(players[i],sp);});
    Object.keys(regions).forEach(k=>{if(s.regions[k])Object.assign(regions[k],s.regions[k]);});
    current=Number.isInteger(s.current)?s.current:current;
    rolled=!!s.rolled;
    rollsThisTurn=Number(s.rollsThisTurn)||0;
    rollLimit=Math.max(1,Number(s.rollLimit)||1);
    economyTurnCount=Number(s.economyTurnCount)||0;
    totalTurnsCompleted=Number(s.totalTurnsCompleted)||0;
    targetMode=null; editN=null;
    document.querySelectorAll('.modal').forEach(m=>m.classList.remove('show'));
    document.getElementById('d1').textContent='–';document.getElementById('d2').textContent='–';
    render();
    const roll=document.getElementById('roll'),end=document.getElementById('end'),g=document.getElementById('guerrilla');
    if(roll)roll.disabled=rolled||rollsThisTurn>=rollLimit;
    if(end)end.disabled=!rolled;
    if(g)g.disabled=rolled||players[current].nd<20;
  }finally{applyingRemoteState=false;}
}
function sendSharedState(){
  if(!onlineSocket||onlineSocket.readyState!==WebSocket.OPEN||applyingRemoteState)return;
  setOnlineStatus('syncing','🟠 Menyinkronkan...');
  onlineSocket.send(JSON.stringify({type:'state',state:getSharedState()}));
  setTimeout(()=>{if(onlineReady)setOnlineStatus('online','🟢 Online • papan bersama');},180);
}
function scheduleSync(){
  if(applyingRemoteState||!onlineReady)return;
  clearTimeout(syncTimer);syncTimer=setTimeout(sendSharedState,80);
}
function connectOnline(){
  const proto=location.protocol==='https:'?'wss':'ws';
  const url=proto+'://'+location.host+'/ws';
  try{onlineSocket=new WebSocket(url);}catch(e){setOnlineStatus('offline','🔴 Gagal terhubung');return;}
  onlineSocket.addEventListener('open',()=>{
    onlineReady=true;setOnlineStatus('online','🟢 Terhubung • papan bersama');
    onlineSocket.send(JSON.stringify({type:'request_state'}));
  });
  onlineSocket.addEventListener('message',ev=>{
    try{
      const msg=JSON.parse(ev.data);
      if(msg.type==='state'&&msg.state){applySharedState(msg.state);setOnlineStatus('online','🟢 Online • papan bersama');}
      else if(msg.type==='need_state'){sendSharedState();}
    }catch(e){}
  });
  onlineSocket.addEventListener('close',()=>{onlineReady=false;setOnlineStatus('offline','🔴 Terputus • mencoba lagi...');setTimeout(connectOnline,1500);});
  onlineSocket.addEventListener('error',()=>setOnlineStatus('offline','🔴 Koneksi bermasalah'));
}
/* Every normal render becomes a synchronization point. Remote renders are protected by applyingRemoteState. */
const __originalRender=render;
render=function(){__originalRender();scheduleSync();};
connectOnline();

render();log('Permainan dimulai. Lempar dadu untuk memulai. Efek Serangan/Gerilya hanya dapat aktif 1 kali per giliran.');

function fitBoardToViewport(){
  const wrap=document.querySelector('.boardWrap');
  const b=document.getElementById('board');
  if(!wrap||!b)return;
  const r=wrap.getBoundingClientRect();
  const availableW=Math.max(0, r.width-20);
  const availableH=Math.max(240, window.innerHeight-r.top-20);
  const maxSize=Math.floor(Math.min(availableW, availableH, 1200));
  const scale=(typeof boardScale==='number'&&Number.isFinite(boardScale))?boardScale:1;
  const size=Math.max(0, Math.floor(maxSize*scale));
  if(size>0){b.style.width=size+'px';b.style.height=size+'px';}
}

function setAutopilot(on){
  autopilot=on;
  const b=document.getElementById('autopilot');
  if(b){b.textContent=on?'🤖 Autopilot: ON':'🤖 Autopilot: OFF';b.classList.toggle('active',on);}
  if(on) { if(autopilotTimer) clearTimeout(autopilotTimer); runAutopilot(); }
  else if(autopilotTimer){clearTimeout(autopilotTimer);autopilotTimer=null;}
}
function runAutopilot(){
  if(!autopilot)return;
  const end=document.getElementById('end'), roll=document.getElementById('roll'), guerrilla=document.getElementById('guerrilla');
  const switchModal=document.getElementById('switchModal');
  if(switchModal && switchModal.classList.contains('show')){ document.getElementById('switchYes').click(); setTimeout(runAutopilot,100); return; }
  const cards=[...document.querySelectorAll('.learn-card')].filter(x=>x.offsetParent!==null);
  if(cards.length){
    if(document.getElementById('autoLearn').checked){
      const pending=pendingLearn;
      let choice=cards[0];
      if(pending){
        const rarityRank={biasa:1,bagus:2,super:3,master:4};
        const effectCards=cards.filter(card=>{
          const i=Number(card.dataset.index);
          const c=pending.cards[i];
          return !!(c&&cardEffects[pending.side]&&cardEffects[pending.side][c.name]);
        });
        const pool=effectCards.length?effectCards:cards;
        choice=pool.slice().sort((a,b)=>{
          const ca=pending.cards[Number(a.dataset.index)], cb=pending.cards[Number(b.dataset.index)];
          const ea=!!(ca&&cardEffects[pending.side]&&cardEffects[pending.side][ca.name]);
          const eb=!!(cb&&cardEffects[pending.side]&&cardEffects[pending.side][cb.name]);
          if(ea!==eb)return eb-ea;
          const ra=rarityRank[rarityKeys[ca.rarity]]||0, rb=rarityRank[rarityKeys[cb.rarity]]||0;
          if(ra!==rb)return rb-ra;
          const ka=cardKind(ca.name)?1:0, kb=cardKind(cb.name)?1:0;
          return kb-ka;
        })[0];
      }
      choice.click(); setTimeout(runAutopilot,100);
    }
    return;
  }
  if(document.getElementById('autoGuerrilla').checked && !guerrilla.disabled){
    guerrilla.click(); setTimeout(runAutopilot,100); return;
  }
  if(document.getElementById('autoRoll').checked && !roll.disabled){
    roll.click(); setTimeout(runAutopilot,100); return;
  }
  if(document.getElementById('autoEnd').checked && rolled && !end.disabled){
    autopilotTimer=setTimeout(()=>{ if(autopilot && !end.disabled) end.click(); setTimeout(runAutopilot,100); },1000);
  }
}
document.getElementById('autopilot').onclick=()=>setAutopilot(!autopilot);
window.addEventListener('resize',fitBoardToViewport);
window.addEventListener('orientationchange',fitBoardToViewport);
fitBoardToViewport();
